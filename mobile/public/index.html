<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f2f4e9" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Éclaircie, ta météo intérieure. Un moment pour toi, jour après jour." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Éclaircie" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #f2f4e9; }
      html { -webkit-text-size-adjust: 100%; }
      body { overflow: hidden; overscroll-behavior: none; }
      #root { display: flex; width: 100%; height: 100%; min-height: 0; flex: 1; overflow: hidden; }
      @supports (height: 100dvh) { html { height: 100dvh; } }
    </style>
  </head>
  <body>
    <noscript>Active JavaScript pour ouvrir Éclaircie.</noscript>
    <div id="root"></div>
  </body>
</html>
