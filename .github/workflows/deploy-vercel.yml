name: Deploy front and demo backend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - '.github/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '65.1.0'

jobs:
  validate:
    name: Validate the production source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require protected main
        env:
          CURRENT_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$CURRENT_REF" != 'refs/heads/main' || "$REF_PROTECTED" != 'true' ]]; then
            echo '::error::Deployments require a protected main branch. Configure its protection before enabling production credentials.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix mobile
      - name: Check frontend
        run: |
          npm --prefix mobile run typecheck
          npm --prefix mobile test
          node --test .github/tests/*.test.cjs
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend
        run: |
          npm --prefix backend test
          backend/node_modules/.bin/tsc --noEmit --incremental false --project backend/tsconfig.json

  deploy:
    name: Publish the tested commit
    needs: validate
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://moodly-front.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Build, verify and publish backend demo then front
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MOODLY_REF_PROTECTED: ${{ github.ref_protected }}
        run: node .github/scripts/deploy-vercel.cjs
